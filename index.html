    <script>
      /* ===================== 설정 ===================== */
      const COLS = 10,
        ROWS = 18;
      const PIECES = "TJLOSZI";
      const THEMES = {
        classic: [
          "#facc15",
          "#22d3ee",
          "#fb923c",
          "#60a5fa",
          "#4ade80",
          "#f87171",
          "#c084fc",
        ],
        neon: ["#0ff", "#f0f", "#ff0", "#0f0", "#f00", "#00f", "#fff"],
        pastel: [
          "#fde68a",
          "#bae6fd",
          "#fecaca",
          "#bbf7d0",
          "#e9d5ff",
          "#ddd6fe",
          "#fed7aa",
        ],
        mono: ["#999", "#aaa", "#bbb", "#ccc", "#ddd", "#eee", "#fff"],
      };
      let COLORS = THEMES.classic;

      /* ===================== 통계 ===================== */
      let stats = JSON.parse(
        localStorage.stats || '{"play":0,"win":0,"lose":0}'
      );
      function saveStats() {
        localStorage.stats = JSON.stringify(stats);
      }
      function showStats() {
        stats.play++;
        saveStats();
        document.getElementById(
          "stats"
        ).textContent = `플레이 ${stats.play} | 승 ${stats.win} | 패 ${stats.lose}`;
      }

      /* ===================== 사운드 ===================== */
      let ctx = null;
      let bgmSource = null;
      let bgmGain = null;

      function initAudio() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === "suspended") {
          ctx.resume();
        }
      }

      function beep(freq = 400, dur = 0.1) {
        try {
          initAudio();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.frequency.value = freq;
          o.connect(g);
          g.connect(ctx.destination);
          o.start();
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
          o.stop(ctx.currentTime + dur);
        } catch (e) {
          // 사운드 실패 시 무시
        }
      }

      function startBGM() {
        try {
          initAudio();
          if (bgmSource) {
            stopBGM();
          }

          // 테트리스 BGM (Korobeiniki) - 정확한 멜로디
          const melody = [
            // 첫 번째 구절
            { freq: 523.25, dur: 0.12 }, // E5
            { freq: 493.88, dur: 0.12 }, // B4
            { freq: 440, dur: 0.12 }, // A4
            { freq: 392, dur: 0.12 }, // G4
            { freq: 349.23, dur: 0.24 }, // F4
            { freq: 392, dur: 0.12 }, // G4
            { freq: 440, dur: 0.24 }, // A4
            { freq: 392, dur: 0.12 }, // G4
            { freq: 349.23, dur: 0.12 }, // F4
            { freq: 329.63, dur: 0.12 }, // E4
            { freq: 293.66, dur: 0.24 }, // D4
            // 두 번째 구절
            { freq: 293.66, dur: 0.12 }, // D4
            { freq: 349.23, dur: 0.12 }, // F4
            { freq: 392, dur: 0.24 }, // G4
            { freq: 349.23, dur: 0.12 }, // F4
            { freq: 329.63, dur: 0.12 }, // E4
            { freq: 293.66, dur: 0.24 }, // D4
            // 세 번째 구절
            { freq: 440, dur: 0.12 }, // A4
            { freq: 493.88, dur: 0.12 }, // B4
            { freq: 523.25, dur: 0.12 }, // E5
            { freq: 493.88, dur: 0.12 }, // B4
            { freq: 440, dur: 0.12 }, // A4
            { freq: 392, dur: 0.12 }, // G4
            { freq: 349.23, dur: 0.24 }, // F4
            { freq: 392, dur: 0.12 }, // G4
            { freq: 440, dur: 0.24 }, // A4
            // 네 번째 구절
            { freq: 392, dur: 0.12 }, // G4
            { freq: 349.23, dur: 0.12 }, // F4
            { freq: 329.63, dur: 0.12 }, // E4
            { freq: 293.66, dur: 0.24 }, // D4
            { freq: 293.66, dur: 0.12 }, // D4
            { freq: 349.23, dur: 0.12 }, // F4
            { freq: 392, dur: 0.24 }, // G4
            { freq: 349.23, dur: 0.12 }, // F4
            { freq: 329.63, dur: 0.12 }, // E4
            { freq: 293.66, dur: 0.36 }, // D4
          ];

          bgmGain = ctx.createGain();
          bgmGain.gain.value = 0.2;
          bgmGain.connect(ctx.destination);

          let loopTimeout = null;
          let isPlaying = true;

          function playNote(note, time) {
            try {
              const o = ctx.createOscillator();
              const g = ctx.createGain();
              o.type = "square";
              o.frequency.value = note.freq;
              o.connect(g);
              g.connect(bgmGain);
              g.gain.setValueAtTime(0.15, time);
              g.gain.exponentialRampToValueAtTime(0.01, time + note.dur);
              o.start(time);
              o.stop(time + note.dur);
            } catch (e) {
              // 노트 재생 실패 시 무시
            }
          }

          function playLoop() {
            if (!gameRunning || !isPlaying) {
              bgmSource = null;
              if (loopTimeout) clearTimeout(loopTimeout);
              return;
            }

            const startTime = ctx.currentTime;
            let noteTime = startTime;

            melody.forEach((note) => {
              playNote(note, noteTime);
              noteTime += note.dur;
            });

            const totalDur = noteTime - startTime;
            loopTimeout = setTimeout(() => {
              if (gameRunning && isPlaying) {
                playLoop();
              }
            }, totalDur * 1000);
          }

          bgmSource = {
            stop: () => {
              isPlaying = false;
              if (loopTimeout) {
                clearTimeout(loopTimeout);
                loopTimeout = null;
              }
            },
          };

          // 약간의 지연 후 시작 (AudioContext가 준비될 시간)
          setTimeout(() => {
            if (gameRunning) {
              playLoop();
            }
          }, 100);
        } catch (e) {
          console.error("BGM 오류:", e);
        }
      }

      function stopBGM() {
        if (bgmSource) {
          bgmSource.stop();
          bgmSource = null;
        }
        if (bgmGain) {
          bgmGain.gain.cancelScheduledValues(ctx.currentTime);
          bgmGain.gain.setValueAtTime(0, ctx.currentTime);
          bgmGain = null;
        }
      }

      /* ===================== 엔진 ===================== */
      function arena() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      }
      function piece(t) {
        return {
          T: [
            [0, 1, 0],
            [1, 1, 1],
          ],
          O: [
            [2, 2],
            [2, 2],
          ],
          L: [
            [0, 0, 3],
            [3, 3, 3],
          ],
          J: [
            [4, 0, 0],
            [4, 4, 4],
          ],
          I: [[5, 5, 5, 5]],
          S: [
            [0, 6, 6],
            [6, 6, 0],
          ],
          Z: [
            [7, 7, 0],
            [0, 7, 7],
          ],
        }[t];
      }
      function rand() {
        return PIECES[(Math.random() * 7) | 0];
      }

      function Player(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.ctx.scale(40, 40); // 캔버스 크기에 맞게 스케일 조정 (400/10 = 40)
        this.field = arena();
        this.matrix = piece(rand());
        this.pos = { x: 3, y: 0 };
        this.score = 0;
        this.lines = 0;
        this.gameOver = false;
      }

      function collide(p, offset = { x: 0, y: 0 }) {
        const pos = { x: p.pos.x + offset.x, y: p.pos.y + offset.y };
        return p.matrix.some((r, y) =>
          r.some((v, x) => {
            if (!v) return false;
            const nx = x + pos.x;
            const ny = y + pos.y;
            return (
              nx < 0 ||
              nx >= COLS ||
              ny >= ROWS ||
              (ny >= 0 && p.field[ny]?.[nx] !== 0)
            );
          })
        );
      }

      function rotate(m) {
        const rows = m.length;
        const cols = m[0].length;
        const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            rotated[x][rows - 1 - y] = m[y][x];
          }
        }
        return rotated;
      }

      function tryRotate(p) {
        const rotated = rotate(p.matrix);
        const oldMatrix = p.matrix;
        const oldPos = { ...p.pos };

        // 회전 시도
        p.matrix = rotated;

        // 충돌 체크
        if (!collide(p)) {
          return true;
        }

        // Wall kick 시도: 왼쪽으로 1칸
        p.pos.x--;
        if (!collide(p)) {
          return true;
        }

        // 오른쪽으로 1칸
        p.pos.x += 2;
        if (!collide(p)) {
          return true;
        }

        // 왼쪽으로 2칸
        p.pos.x -= 3;
        if (!collide(p)) {
          return true;
        }

        // 오른쪽으로 2칸
        p.pos.x += 4;
        if (!collide(p)) {
          return true;
        }

        // 실패 시 원래대로
        p.matrix = oldMatrix;
        p.pos = oldPos;
        return false;
      }

      function merge(p) {
        p.matrix.forEach((r, y) =>
          r.forEach((v, x) => {
            if (v && y + p.pos.y >= 0) {
              p.field[y + p.pos.y][x + p.pos.x] = v;
            }
          })
        );
      }

      function sweep(p) {
        let c = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
          if (p.field[y].every((v) => v)) {
            p.field.splice(y, 1);
            p.field.unshift(Array(COLS).fill(0));
            c++;
            y++;
          }
        }
        if (c) {
          p.lines += c;
          // 라인 수에 따른 점수 계산
          const points = [0, 100, 300, 500, 800];
          p.score += points[c] || c * 100;
          beep(600);
          navigator.vibrate?.(50);
        }
      }

      function draw(p) {
        const ctx = p.ctx;
        ctx.clearRect(0, 0, COLS, ROWS);

        // 배경
        ctx.fillStyle = "#0a0a0a";
        ctx.fillRect(0, 0, COLS, ROWS);

        // 그리드 라인
        ctx.strokeStyle = "#1a1a1a";
        ctx.lineWidth = 0.02;
        for (let x = 0; x <= COLS; x++) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, ROWS);
          ctx.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(COLS, y);
          ctx.stroke();
        }

        // 고정된 블록
        p.field.forEach((r, y) =>
          r.forEach((v, x) => {
            if (v) {
              ctx.fillStyle = COLORS[v - 1];
              ctx.fillRect(x + 0.05, y + 0.05, 0.9, 0.9);
              // 하이라이트
              ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
              ctx.fillRect(x + 0.05, y + 0.05, 0.9, 0.2);
            }
          })
        );

        // 현재 블록
        p.matrix.forEach((r, y) =>
          r.forEach((v, x) => {
            if (v) {
              const drawY = y + p.pos.y;
              if (drawY >= 0) {
                ctx.fillStyle = COLORS[v - 1];
                ctx.fillRect(x + p.pos.x + 0.05, drawY + 0.05, 0.9, 0.9);
                // 하이라이트
                ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                ctx.fillRect(x + p.pos.x + 0.05, drawY + 0.05, 0.9, 0.2);
              }
            }
          })
        );

        // 점수 업데이트
        const scoreEl =
          p === p1
            ? document.getElementById("p1-score")
            : document.getElementById("p2-score");
        if (scoreEl) {
          scoreEl.textContent = `점수: ${p.score} | 라인: ${p.lines}`;
        }
      }

      /* ===================== AI ===================== */
      function aiMove(ai) {
        if (!ai) return;
        const dir = Math.random() < 0.5 ? -1 : 1;
        ai.pos.x += dir;
        if (collide(ai)) {
          ai.pos.x -= dir;
        }
        if (Math.random() < 0.1) {
          tryRotate(ai);
        }
      }

      /* ===================== 시작 ===================== */
      let p1,
        p2,
        mode,
        gameRunning = false;
      const keys = {};
      const keyTimers = {};

      function handleKey(player, actions) {
        if (!player) return;

        if (actions.left) {
          player.pos.x--;
          if (collide(player)) player.pos.x++;
          else beep(200, 0.05);
        }
        if (actions.right) {
          player.pos.x++;
          if (collide(player)) player.pos.x--;
          else beep(200, 0.05);
        }
        if (actions.down) {
          drop(player);
        }
        if (actions.rotate) {
          if (tryRotate(player)) {
            beep(300, 0.05);
          }
        }
        if (actions.hardDrop) {
          while (!collide(player, { x: 0, y: 1 })) {
            player.pos.y++;
          }
          drop(player);
        }
      }

      function startKeyRepeat(keyCode, player, actions) {
        if (keyTimers[keyCode]) return;

        // 즉시 실행
        handleKey(player, actions);

        // 첫 반복은 약간 늦게
        keyTimers[keyCode] = setTimeout(() => {
          const interval = setInterval(() => {
            if (!keys[keyCode] || !gameRunning) {
              clearInterval(interval);
              keyTimers[keyCode] = null;
              return;
            }
            handleKey(player, actions);
          }, 50); // 빠른 반복 (50ms)

          keyTimers[keyCode] = interval;
        }, 200); // 첫 반복까지 200ms 대기
      }

      function stopKeyRepeat(keyCode) {
        if (keyTimers[keyCode]) {
          if (typeof keyTimers[keyCode] === "number") {
            clearTimeout(keyTimers[keyCode]);
          } else {
            clearInterval(keyTimers[keyCode]);
          }
          keyTimers[keyCode] = null;
        }
      }

      // 스크롤 방지를 위한 전역 이벤트 리스너
      document.addEventListener(
        "keydown",
        (e) => {
          // 게임 중일 때만 방향키와 스페이스바 스크롤 방지
          if (gameRunning) {
            if (
              ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(
                e.key
              )
            ) {
              e.preventDefault();
            }
          }
        },
        { passive: false }
      );

      document.addEventListener("keydown", (e) => {
        if (!gameRunning) return;
        const key = e.key.toLowerCase();
        const keyCode = e.key;

        // 이미 눌린 키는 무시 (키 반복 방지)
        if (keys[keyCode] || (key !== keyCode && keys[key])) return;

        const code = e.code;

        if (mode === "duo") {
          // 2P 모드: 1P는 WASD + 스페이스, 2P는 방향키 + 엔터

          // P1 컨트롤 (WASD + 스페이스)
          if (p1) {
            if (code === "KeyA" || key === "a") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p1-a";
              if (!keys[keyId]) {
                keys[keyId] = true;
                startKeyRepeat(keyId, p1, { left: true });
              }
            } else if (code === "KeyD" || key === "d") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p1-d";
              if (!keys[keyId]) {
                keys[keyId] = true;
                startKeyRepeat(keyId, p1, { right: true });
              }
            } else if (code === "KeyS" || key === "s") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p1-s";
              if (!keys[keyId]) {
                keys[keyId] = true;
                startKeyRepeat(keyId, p1, { down: true });
              }
            } else if (code === "KeyW" || key === "w") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p1-w";
              if (!keys[keyId]) {
                keys[keyId] = true;
                handleKey(p1, { rotate: true });
              }
            } else if (keyCode === " " && p1) {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p1-space";
              if (!keys[keyId]) {
                keys[keyId] = true;
                handleKey(p1, { hardDrop: true });
              }
            }
          }

          // P2 컨트롤 (방향키 + 엔터)
          if (p2) {
            if (keyCode === "ArrowLeft") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p2-ArrowLeft";
              if (!keys[keyId]) {
                keys[keyId] = true;
                startKeyRepeat(keyId, p2, { left: true });
              }
            } else if (keyCode === "ArrowRight") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p2-ArrowRight";
              if (!keys[keyId]) {
                keys[keyId] = true;
                startKeyRepeat(keyId, p2, { right: true });
              }
            } else if (keyCode === "ArrowDown") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p2-ArrowDown";
              if (!keys[keyId]) {
                keys[keyId] = true;
                startKeyRepeat(keyId, p2, { down: true });
              }
            } else if (keyCode === "ArrowUp") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p2-ArrowUp";
              if (!keys[keyId]) {
                keys[keyId] = true;
                handleKey(p2, { rotate: true });
              }
            } else if (code === "Enter" || keyCode === "Enter") {
              e.preventDefault();
              e.stopPropagation();
              const keyId = "p2-enter";
              if (!keys[keyId]) {
                keys[keyId] = true;
                handleKey(p2, { hardDrop: true });
              }
            }
          }
        } else {
          // 1P 혼자: 방향키 + 스페이스
          if (keyCode === "ArrowLeft" && p1) {
            e.preventDefault();
            e.stopPropagation();
            keys["ArrowLeft"] = true;
            startKeyRepeat("ArrowLeft", p1, { left: true });
          }
          if (keyCode === "ArrowRight" && p1) {
            e.preventDefault();
            e.stopPropagation();
            keys["ArrowRight"] = true;
            startKeyRepeat("ArrowRight", p1, { right: true });
          }
          if (keyCode === "ArrowDown" && p1) {
            e.preventDefault();
            e.stopPropagation();
            keys["ArrowDown"] = true;
            startKeyRepeat("ArrowDown", p1, { down: true });
          }
          if (keyCode === "ArrowUp" && p1) {
            e.preventDefault();
            e.stopPropagation();
            keys["ArrowUp"] = true;
            handleKey(p1, { rotate: true });
          }
          if (keyCode === " " && p1) {
            e.preventDefault();
            e.stopPropagation();
            keys[" "] = true;
            handleKey(p1, { hardDrop: true });
          }
        }
      });

      // 모바일 터치 컨트롤
      function initMobileControls() {
        const isMobile =
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent
          );
        const mobileControls = document.getElementById("mobile-controls");

        if (!mobileControls) return;

        // 게임 중일 때만 표시
        if (isMobile && gameRunning) {
          mobileControls.classList.remove("hidden");
        } else {
          mobileControls.classList.add("hidden");
        }

        // 터치 버튼 이벤트
        document.getElementById("btn-left")?.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            if (p1 && gameRunning) {
              handleKey(p1, { left: true });
            }
          },
          { passive: false }
        );

        document.getElementById("btn-right")?.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            if (p1 && gameRunning) {
              handleKey(p1, { right: true });
            }
          },
          { passive: false }
        );

        document.getElementById("btn-rotate")?.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            if (p1 && gameRunning) {
              handleKey(p1, { rotate: true });
            }
          },
          { passive: false }
        );

        document.getElementById("btn-down")?.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            if (p1 && gameRunning) {
              handleKey(p1, { down: true });
            }
          },
          { passive: false }
        );

        document.getElementById("btn-hard-drop")?.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            if (p1 && gameRunning) {
              handleKey(p1, { hardDrop: true });
            }
          },
          { passive: false }
        );

        // 스와이프 제스처
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener(
          "touchstart",
          (e) => {
            if (!gameRunning || !p1) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          },
          { passive: true }
        );

        document.addEventListener(
          "touchend",
          (e) => {
            if (!gameRunning || !p1) return;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            const threshold = 30;

            if (Math.abs(diffX) > Math.abs(diffY)) {
              // 좌우 스와이프
              if (Math.abs(diffX) > threshold) {
                if (diffX > 0) {
                  handleKey(p1, { right: true });
                } else {
                  handleKey(p1, { left: true });
                }
              }
            } else {
              // 상하 스와이프
              if (Math.abs(diffY) > threshold) {
                if (diffY > 0) {
                  handleKey(p1, { down: true });
                } else {
                  handleKey(p1, { rotate: true });
                }
              }
            }
          },
          { passive: true }
        );
      }

      document.addEventListener("keyup", (e) => {
        const key = e.key.toLowerCase();
        const keyCode = e.key;
        const code = e.code;

        if (mode === "duo") {
          // 2P 모드: 1P는 WASD + 스페이스, 2P는 방향키 + 엔터

          // P1 키 해제 (WASD + 스페이스)
          if (code === "KeyA" || key === "a") {
            keys["p1-a"] = false;
            stopKeyRepeat("p1-a");
          }
          if (code === "KeyD" || key === "d") {
            keys["p1-d"] = false;
            stopKeyRepeat("p1-d");
          }
          if (code === "KeyS" || key === "s") {
            keys["p1-s"] = false;
            stopKeyRepeat("p1-s");
          }
          if (code === "KeyW" || key === "w") {
            keys["p1-w"] = false;
          }
          if (keyCode === " ") {
            keys["p1-space"] = false;
          }

          // P2 키 해제 (방향키 + 엔터)
          if (keyCode === "ArrowLeft") {
            keys["p2-ArrowLeft"] = false;
            stopKeyRepeat("p2-ArrowLeft");
          }
          if (keyCode === "ArrowRight") {
            keys["p2-ArrowRight"] = false;
            stopKeyRepeat("p2-ArrowRight");
          }
          if (keyCode === "ArrowDown") {
            keys["p2-ArrowDown"] = false;
            stopKeyRepeat("p2-ArrowDown");
          }
          if (keyCode === "ArrowUp") {
            keys["p2-ArrowUp"] = false;
          }
          if (code === "Enter" || keyCode === "Enter") {
            keys["p2-enter"] = false;
          }
        } else {
          // 1P 혼자: 방향키 + 스페이스
          if (keyCode === "ArrowLeft") {
            keys["ArrowLeft"] = false;
            stopKeyRepeat("ArrowLeft");
          }
          if (keyCode === "ArrowRight") {
            keys["ArrowRight"] = false;
            stopKeyRepeat("ArrowRight");
          }
          if (keyCode === "ArrowDown") {
            keys["ArrowDown"] = false;
            stopKeyRepeat("ArrowDown");
          }
          if (keyCode === "ArrowUp") {
            keys["ArrowUp"] = false;
          }
          if (keyCode === " ") {
            keys[" "] = false;
          }
        }
      });

      function start(m) {
        mode = m;
        gameRunning = true;
        gamePaused = false;
        p1GameOver = false;
        p2GameOver = false;
        COLORS = THEMES[document.getElementById("theme").value];
        document.getElementById("menu").classList.add("hidden");
        document.getElementById("game").classList.remove("hidden");
        document.getElementById("game-controls").classList.remove("hidden");
        document.getElementById("result").textContent = "";

        // 캔버스 크기 설정
        const p1Canvas = document.getElementById("p1");
        const p2Canvas = document.getElementById("p2");
        p1Canvas.width = 400;
        p1Canvas.height = 720;
        p2Canvas.width = 400;
        p2Canvas.height = 720;

        if (mode === "duo" || mode === "solo") {
          document.getElementById("p2-panel").classList.remove("hidden");
        } else {
          document.getElementById("p2-panel").classList.add("hidden");
        }
        p1 = new Player(p1Canvas);
        if (mode === "duo" || mode === "solo") p2 = new Player(p2Canvas);
        else p2 = null;
        showStats();
        last = 0;

        // AudioContext 초기화를 위해 사용자 상호작용 후 BGM 시작
        initAudio();
        setTimeout(() => {
          startBGM();
        }, 100);

        // 모바일 컨트롤 초기화
        initMobileControls();

        // 다시 시작 버튼 숨기기
        document.getElementById("p1-resume-btn").classList.add("hidden");
        document.getElementById("p2-resume-btn").classList.add("hidden");

        // 조작법 안내 업데이트
        if (mode === "duo") {
          document.getElementById("p1-controls").innerHTML = `
            <div>WASD 이동 | W 회전 | S 빠른 낙하</div>
            <div>스페이스바: 한 번에 떨어뜨리기</div>
          `;
          document.getElementById("p2-controls").innerHTML = `
            <div>← → 이동 | ↑ 회전 | ↓ 빠른 낙하</div>
            <div>Enter: 한 번에 떨어뜨리기</div>
          `;
        } else {
          document.getElementById("p1-controls").innerHTML = `
            <div>← → 이동 | ↑ 회전 | ↓ 빠른 낙하</div>
            <div>스페이스바: 한 번에 떨어뜨리기</div>
          `;
        }

        loop();
      }

      function pauseGame() {
        if (!gameRunning) return;
        gamePaused = !gamePaused;
        if (gamePaused) {
          document.getElementById("result").textContent = "⏸️ 일시정지";
        } else {
          document.getElementById("result").textContent = "";
        }
      }

      /* ===================== 루프 ===================== */
      function drop(p) {
        if (!p) return;
        p.pos.y++;
        if (collide(p)) {
          p.pos.y--;
          merge(p);
          sweep(p);
          p.matrix = piece(rand());
          p.pos = { x: 3, y: 0 };
          if (collide(p)) {
            // 게임 오버 처리 (게임은 계속 진행)
            if (p === p1) {
              p1GameOver = true;
              beep(200, 0.3);
              navigator.vibrate?.(100);
              document
                .getElementById("p1-resume-btn")
                .classList.remove("hidden");
              if (mode === "duo") {
                if (!p2GameOver) {
                  document.getElementById("result").textContent =
                    "🎉 2P 승리! (1P는 다시 시작 가능)";
                  stats.win++;
                }
              } else {
                document.getElementById(
                  "result"
                ).textContent = `게임 오버! 점수: ${p1.score} | 라인: ${p1.lines}`;
                stats.lose++;
              }
              saveStats();
            } else if (p === p2) {
              p2GameOver = true;
              beep(200, 0.3);
              navigator.vibrate?.(100);
              document
                .getElementById("p2-resume-btn")
                .classList.remove("hidden");
              if (mode === "duo") {
                if (!p1GameOver) {
                  document.getElementById("result").textContent =
                    "🎉 1P 승리! (2P는 다시 시작 가능)";
                  stats.win++;
                }
              }
              saveStats();
            }

            // 모든 플레이어가 게임 오버되면 게임 종료
            if (
              (p1GameOver && (mode === "solo" || !p2)) ||
              (mode === "duo" && p1GameOver && p2GameOver)
            ) {
              setTimeout(() => {
                stopBGM();
                Object.keys(keyTimers).forEach((key) => {
                  stopKeyRepeat(key);
                });
                document.getElementById("menu").classList.remove("hidden");
                document.getElementById("game").classList.add("hidden");
                document
                  .getElementById("game-controls")
                  .classList.add("hidden");
                const shareButtonsEl = document.getElementById("share-buttons");
                if (shareButtonsEl) shareButtonsEl.classList.add("hidden");
                const mobileControls =
                  document.getElementById("mobile-controls");
                if (mobileControls) mobileControls.classList.add("hidden");
                gameRunning = false;
              }, 3000);
            }
            return;
          }
        }
      }

      let last = 0;
      function loop(t = 0) {
        if (!gameRunning || gamePaused) {
          if (gamePaused) {
            requestAnimationFrame(loop);
          }
          return;
        }

        if (t - last > 700) {
          if (!p1GameOver && p1) drop(p1);
          if (mode === "duo" && p2 && !p2GameOver) drop(p2);
          if (mode === "solo" && p2 && !p2GameOver) {
            drop(p2);
            aiMove(p2);
          }
          last = t;
        }

        if (p1 && !p1GameOver) draw(p1);
        else if (p1 && p1GameOver) {
          // 게임 오버된 플레이어는 회색으로 표시
          const ctx = p1.ctx;
          ctx.clearRect(0, 0, COLS, ROWS);
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, COLS, ROWS);
          ctx.fillStyle = "rgba(100, 100, 100, 0.5)";
          ctx.fillRect(0, 0, COLS, ROWS);

          // 게임 오버 텍스트
          ctx.fillStyle = "#fff";
          ctx.font = "bold 1.5px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const centerX = COLS / 2;
          const centerY = ROWS / 2;

          // 텍스트 배경
          ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
          ctx.fillRect(centerX - 3, centerY - 1.5, 6, 3);

          // 텍스트
          ctx.fillStyle = "#ff0000";
          ctx.fillText("GAME", centerX, centerY - 0.5);
          ctx.fillText("OVER", centerX, centerY + 0.5);
        }

        if ((mode === "duo" || mode === "solo") && p2) {
          if (!p2GameOver) draw(p2);
          else {
            const ctx = p2.ctx;
            ctx.clearRect(0, 0, COLS, ROWS);
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, COLS, ROWS);
            ctx.fillStyle = "rgba(100, 100, 100, 0.5)";
            ctx.fillRect(0, 0, COLS, ROWS);

            // 게임 오버 텍스트
            ctx.fillStyle = "#fff";
            ctx.font = "bold 1.5px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const centerX = COLS / 2;
            const centerY = ROWS / 2;

            // 텍스트 배경
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(centerX - 3, centerY - 1.5, 6, 3);

            // 텍스트
            ctx.fillStyle = "#ff0000";
            ctx.fillText("GAME", centerX, centerY - 0.5);
            ctx.fillText("OVER", centerX, centerY + 0.5);
          }
        }
        requestAnimationFrame(loop);
      }

      let lastWinner = null;

      function shareResult() {
        const resultText = document.getElementById("result").textContent;
        const scoreText =
          mode === "duo"
            ? `${lastWinner}P 승리!`
            : `점수: ${p1?.score || 0} | 라인: ${p1?.lines || 0}`;
        const shareText = `🧱 하루 한판 테트리스\n${resultText}\n${scoreText}\n\nhttps://funnyfunny.cloud/`;

        if (navigator.share) {
          navigator
            .share({
              title: "하루 한판 테트리스",
              text: shareText,
              url: window.location.href,
            })
            .catch(() => {
              // 공유 취소 시 무시
            });
        } else {
          // 클립보드에 복사
          navigator.clipboard
            .writeText(shareText)
            .then(() => {
              alert("결과가 클립보드에 복사되었습니다!");
            })
            .catch(() => {
              // 복사 실패 시 텍스트 표시
              prompt("결과를 복사하세요:", shareText);
            });
        }
      }

      function copyLink() {
        const url = window.location.href;
        navigator.clipboard
          .writeText(url)
          .then(() => {
            alert("링크가 클립보드에 복사되었습니다!");
          })
          .catch(() => {
            // 복사 실패 시 텍스트 표시
            prompt("링크를 복사하세요:", url);
          });
      }

      // 전역 함수로 노출
      window.shareResult = shareResult;
      window.copyLink = copyLink;
      window.pauseGame = pauseGame;
      window.resumePlayer = resumePlayer;
      window.pauseGame = pauseGame;
      window.saveGame = saveGame;
      window.resumeGame = resumeGame;
    </script>
